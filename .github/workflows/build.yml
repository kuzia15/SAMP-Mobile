name: Build APK (GTA-2.11)

on:
  workflow_dispatch:
  push:
    branches: [ "GTA-2.11" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK, so no setup action is needed.
      - name: Install SDK, NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" \
                  "ndk;26.2.11394342" "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || {
            # Publish the key error lines as annotations so they can be read without log access.
            grep -nE "error:|fatal error|undefined reference|What went wrong|FAILED|Execution failed|> " build.log \
              | head -9 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11-debug
          path: app/build/outputs/apk/debug/*.apk

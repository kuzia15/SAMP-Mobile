# Put this file at .github/workflows/build.yml inside YOUR private fork of
# kuzia15/SAMP-Mobile, on the GTA-2.11 branch (ARM64, Gradle 8.13, JDK 17).
# Versions below were read from that branch's Gradle files.
# Not yet test-run on GitHub: if it fails, send me the log.
name: Build APK (GTA-2.11)

on:
  workflow_dispatch:
  push:
    branches: [ "GTA-2.11" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
                     "ndk;26.2.11394342" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11-debug
          path: app/build/outputs/apk/debug/*.apk
